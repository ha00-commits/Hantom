<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hantom</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Cairo', sans-serif;
    background: #0b0f14;
    color: #ffffff;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: #121820;
    border: 1px solid #1f2a36;
    border-radius: 18px;
    padding: 22px;
    box-shadow: 0 10px 40px rgba(0,0,0,.5);
  }
  h1 { font-size: 28px; font-weight: 900; margin-bottom: 4px; }
  .sub { color: #7d8a99; font-size: 13px; margin-bottom: 18px; }
  input {
    width: 100%;
    padding: 12px 14px;
    margin-bottom: 10px;
    border-radius: 12px;
    border: 1px solid #24303d;
    background: #0e141b;
    color: #fff;
    font-family: 'Cairo', sans-serif;
    font-size: 15px;
    outline: none;
  }
  input:focus { border-color: #2f80ed; }
  button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 12px;
    background: #2f80ed;
    color: #fff;
    font-family: 'Cairo', sans-serif;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
  }
  button.ghost { background: #1a2330; margin-top: 8px; }
  .row { display: flex; gap: 8px; }
  .hidden { display: none; }
  #chat { display: none; flex-direction: column; height: 100vh; width: 100%; max-width: 520px; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; background: #121820; border-bottom: 1px solid #1f2a36;
  }
  .topbar b { font-weight: 900; }
  #msgs { flex: 1; overflow-y: auto; padding: 14px; }
  .msg { margin-bottom: 10px; }
  .msg .who { font-size: 11px; color: #6d7b8a; margin-bottom: 2px; }
  .msg .body {
    display: inline-block; background: #182230; padding: 9px 12px;
    border-radius: 12px; max-width: 85%; font-size: 15px;
  }
  .msg.me { text-align: left; }
  .msg.me .body { background: #2f80ed; }
  .bottom { display: flex; gap: 8px; padding: 10px; background: #121820; border-top: 1px solid #1f2a36; }
  .bottom input { margin: 0; }
  .bottom button { width: auto; padding: 10px 16px; }
  .tag { font-size: 11px; color: #2f80ed; font-weight: 700; }
</style>
</head>
<body>

<div class="card" id="auth">
  <h1>Hantom</h1>
  <div class="sub">تواصل آمن بأسماء مستخدمين</div>
  <input id="u" placeholder="@username (حروف إنجليزية وأرقام)">
  <input id="p" type="password" placeholder="كلمة السر">
  <button onclick="register()">إنشاء حساب</button>
  <button class="ghost" onclick="login()">تسجيل الدخول</button>
  <div class="sub" id="err" style="color:#ff6b6b;margin-top:10px"></div>
</div>

<div id="chat">
  <div class="topbar">
    <b>Hantom</b>
    <span class="tag" id="me"></span>
  </div>
  <div id="msgs"></div>
  <div class="bottom">
    <button class="ghost" onclick="report()">⚠️</button>
    <input id="t" placeholder="اكتب رسالة...">
    <button onclick="send()">إرسال</button>
  </div>
</div>

<script>
let token = localStorage.getItem("hantom_token");
let ws = null;

async function api(path, body) {
  const r = await fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  return r.json();
}

async function register() {
  const u = document.getElementById("u").value.trim();
  const p = document.getElementById("p").value;
  const res = await api("/register", { username: u, password: p });
  if (!res.ok) return showErr(res.err);
  login();
}

async function login() {
  const u = document.getElementById("u").value.trim();
  const p = document.getElementById("p").value;
  const res = await api("/login", { username: u, password: p });
  if (!res.ok) return showErr(res.err);
  token = res.token;
  localStorage.setItem("hantom_token", token);
  startChat();
}

function showErr(t) { document.getElementById("err").textContent = t || ""; }

function startChat() {
  document.getElementById("auth").classList.add("hidden");
  document.getElementById("chat").style.display = "flex";
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(proto + "://" + location.host);
  ws.onopen = () => {
    ws.send(JSON.stringify({ type: "auth", token }));
    ws.send(JSON.stringify({ type: "join", room: "general" }));
  };
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type === "auth_ok") document.getElementById("me").textContent = "@" + m.username;
    if (m.type === "history") { document.getElementById("msgs").innerHTML = ""; m.messages.forEach(addMsg); }
    if (m.type === "msg") addMsg(m.message);
    if (m.type === "error") alert(m.msg);
  };
}

function addMsg(m) {
  const div = document.createElement("div");
  const mine = m.from === (document.getElementById("me").textContent || "").replace("@","");
  div.className = "msg" + (mine ? " me" : "");
  div.innerHTML = '<div class="who">@' + m.from + '</div><div class="body"></div>';
  div.querySelector(".body").textContent = m.text;
  const box = document.getElementById("msgs");
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function send() {
  const t = document.getElementById("t").value.trim();
  if (!t || !ws) return;
  ws.send(JSON.stringify({ type: "msg", text: t }));
  document.getElementById("t").value = "";
}

async function report() {
  const target = prompt("اسم الشخص اللي تريد تبلغ عنه (@username):");
  if (!target) return;
  const reason = prompt("سبب البلاغ:") || "";
  const res = await api("/report", { token, target: target.replace("@",""), reason });
  alert(res.ok ? "تم إرسال البلاغ ✅" : "فشل البلاغ");
}

if (token) startChat();
</script>
</body>
  </html>
