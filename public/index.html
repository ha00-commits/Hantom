<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hantom</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Cairo',sans-serif;background:#0b0f14;color:#fff;height:100vh;overflow:hidden}
  .hidden{display:none!important}
  #auth{height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .card{width:100%;max-width:400px;background:#121820;border:1px solid #1f2a36;border-radius:18px;padding:22px}
  h1{font-size:28px;font-weight:900}
  .sub{color:#7d8a99;font-size:13px;margin-bottom:16px}
  input{width:100%;padding:12px 14px;margin-bottom:10px;border-radius:12px;border:1px solid #24303d;background:#0e141b;color:#fff;font-family:'Cairo',sans-serif;font-size:15px;outline:none}
  button{padding:12px;border:none;border-radius:12px;background:#2f80ed;color:#fff;font-family:'Cairo',sans-serif;font-weight:700;font-size:14px;cursor:pointer}
  button.ghost{background:#1a2330}
  button.on{background:#2e7d32}
  .w100{width:100%}
  #app{display:flex;height:100vh}
  #side{width:200px;background:#0e141b;border-left:1px solid #1f2a36;display:flex;flex-direction:column}
  #side h2{font-size:16px;padding:14px;font-weight:900}
  #rooms{flex:1;overflow-y:auto}
  .room{padding:10px 14px;cursor:pointer;font-size:14px;border-bottom:1px solid #161f29}
  #sideBtns{padding:10px;display:flex;flex-direction:column;gap:6px}
  #main{flex:1;display:flex;flex-direction:column;min-width:0}
  .topbar{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:#121820;border-bottom:1px solid #1f2a36;gap:6px;flex-wrap:wrap}
  .tag{color:#2f80ed;font-weight:700;font-size:12px}
  #msgs{flex:1;overflow-y:auto;padding:14px}
  .msg{margin-bottom:10px}
  .who{font-size:11px;color:#6d7b8a;display:flex;align-items:center;gap:4px}
  .av{width:16px;height:16px;border-radius:50%;object-fit:cover}
  .body{display:inline-block;background:#182230;padding:9px 12px;border-radius:12px;max-width:85%;font-size:15px;margin-top:2px;word-break:break-word}
  .msg.me{text-align:left}
  .msg.me .body{background:#2f80ed}
  .acts{font-size:11px;color:#6d7b8a;margin-top:3px}
  .acts span{cursor:pointer;margin-inline-end:10px}
  .bottom{display:flex;gap:6px;padding:10px;background:#121820;border-top:1px solid #1f2a36;align-items:center}
  .bottom input{margin:0}
  .burn{font-size:10px;color:#ff7043;margin-top:3px}
  #typing{font-size:11px;color:#6d7b8a;padding:0 14px 6px}
  img.att{max-width:220px;border-radius:10px;display:block;margin-top:5px}
  .check{font-size:11px;color:#4db6ac;margin-inline-start:4px}
</style>
</head>
<body>

<div id="auth">
  <div class="card">
    <h1>Hantom</h1>
    <div class="sub">تواصل آمن بأسماء مستخدمين</div>
    <input id="u" placeholder="@username">
    <input id="p" type="password" placeholder="كلمة السر">
    <button class="w100" onclick="register()">إنشاء حساب</button>
    <button class="ghost w100" style="margin-top:8px" onclick="login()">تسجيل الدخول</button>
    <div class="sub" id="err" style="color:#ff6b6b;margin-top:10px"></div>
  </div>
</div>

<div id="app" class="hidden">
  <div id="side">
    <h2>Hantom</h2>
    <div id="rooms"></div>
    <div id="sideBtns">
      <button class="ghost" onclick="newGroup()">+ مجموعة</button>
      <button class="ghost" onclick="newPrivate()">+ غرفة بكلمة سر</button>
      <button class="ghost" onclick="newDm()">@ محادثة خاصة</button>
      <button class="ghost" onclick="joinRoom()">🔑 انضمام</button>
      <button class="ghost" onclick="showUsers()">👥 الأعضاء</button>
    </div>
  </div>
  <div id="main">
    <div class="topbar">
      <b id="title">general</b>
      <span class="tag" id="me"></span>
      <button class="ghost" onclick="setName()">👤</button>
      <button class="ghost" onclick="document.getElementById('av').click()">🖼️</button>
      <input id="av" type="file" accept="image/*" style="display:none" onchange="uploadAvatar(this)">
      <button class="ghost" onclick="searchMsg()">🔍</button>
      <button class="ghost" id="ownerBtn" style="display:none" onclick="openAdmin()">👑</button>
    </div>
    <div id="msgs"></div>
    <div id="typing"></div>
    <div class="bottom">
      <button class="ghost" id="micBtn" onclick="toggleVoice()">🎙️</button>
      <button class="ghost" onclick="report()">⚠️</button>
      <button class="ghost" onclick="document.getElementById('f').click()">📎</button>
      <button class="ghost" onclick="emoji()">😀</button>
      <button class="ghost" id="burnBtn" onclick="toggleBurn()">🔥</button>
      <input id="f" type="file" style="display:none" onchange="uploadFile(this)">
      <input id="t" placeholder="اكتب رسالة..." style="flex:1">
      <button onclick="send()">إرسال</button>
    </div>
  </div>
</div>

<script>
let token = localStorage.getItem("hantom_token");
let me = "", myName = "", myRole = "member", ws = null, room = "general", replyTo = null, burnMode = false;
let voiceOn = false, peers = {}, localStream = null;
const rtcConf = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };

async function api(p,b){const r=await fetch(p,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});return r.json();}
function err(t){document.getElementById("err").textContent=t||"";}

async function register(){const res=await api("/register",{username:u.value.trim(),password:p.value});if(!res.ok)return err(res.err);login();}
async function login(){const res=await api("/login",{username:u.value.trim(),password:p.value});if(!res.ok)return err(res.err);token=res.token;myRole=res.role;localStorage.setItem("hantom_token",token);start();}

function start(){
  document.getElementById("auth").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  if("Notification" in window) Notification.requestPermission();
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(proto + "://" + location.host);
  ws.onopen = () => {
    ws.send(JSON.stringify({type:"auth",token}));
    ws.send(JSON.stringify({type:"join",room:"general"}));
  };
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if(m.type==="auth_ok"){
      me = m.username; myName = m.name || m.username;
      document.getElementById("me").textContent = myName + " (@" + me + ")";
      if(myRole==="owner") document.getElementById("ownerBtn").style.display="inline-block";
    }
    if(m.type==="history"){ msgs.innerHTML=""; m.messages.forEach(addMsg); if(m.room) setTitle(m.room); }
    if(m.type==="msg"){
      addMsg(m.message);
      if(m.message.from!==me && document.hidden && Notification.permission==="granted"){
        new Notification(m.message.fromName || m.message.from, {body:m.message.text||"[ملف]"});
      }
    }
    if(m.type==="deleted"){ const el=document.getElementById("m_"+m.id); if(el) el.remove(); }
    if(m.type==="created"){ alert("تم إنشاء: "+m.room); join(m.room); }
    if(m.type==="need_pass"){ const pw=prompt("كلمة سر الغرفة:"); if(pw) ws.send(JSON.stringify({type:"join",room:m.room,password:pw})); }
    if(m.type==="typing"){ if(m.from!==me){ const el=document.getElementById("typing"); el.textContent=(m.fromName||m.from)+" يكتب..."; clearTimeout(el._h); el._h=setTimeout(()=>el.textContent="",1500);} }
    if(m.type==="seen" && m.from!==me){
      document.querySelectorAll(".msg.me .body").forEach(b=>{
        if(!b.querySelector(".check")){
          const s=document.createElement("span"); s.className="check"; s.textContent="✓✓"; b.appendChild(s);
        }
      });
    }
    if(m.type==="voice_peer"){ if(voiceOn && m.from!==me) callPeer(m.from); }
    if(m.type==="voice_left"){ if(peers[m.from]){ peers[m.from].close(); delete peers[m.from]; } }
    if(m.type==="voice_signal") handleVoiceSignal(m);
    if(m.type==="error") alert(m.msg);
  };
}
function setTitle(r){ room=r; document.getElementById("title").textContent=r; }
function join(r){ replyTo=null; ws.send(JSON.stringify({type:"join",room:r})); setTitle(r); }

function addMsg(m){
  const div=document.createElement("div");
  div.id="m_"+m.id;
  div.className="msg"+(m.from===me?" me":"");
  const av = m.fromAvatar ? '<img class="av" src="'+m.fromAvatar+'">' : '';
  let html='<div class="who">'+av+(m.fromName||m.from)+' (@'+m.from+')</div><div class="body"></div>';
  html+='<div class="acts"><span onclick="setReply(\''+m.id+'\')">رد</span><span onclick="del(\''+m.id+'\')">حذف</span></div>';
  div.innerHTML=html;
  div.querySelector(".body").textContent=m.text||"";
  if(m.img){ const im=document.createElement("img"); im.className="att"; im.src=m.img; div.appendChild(im); }
  if(m.burn){
    const f=document.createElement("div"); f.className="burn"; f.textContent="🔥 تُحرق بعد 10 ثواني"; div.appendChild(f);
    setTimeout(()=>{ if(ws) ws.send(JSON.stringify({type:"burn",id:m.id})); },10000);
  }
  msgs.appendChild(div);
  msgs.scrollTop=msgs.scrollHeight;
  if(m.from!==me) ws.send(JSON.stringify({type:"seen",room:room}));
}
function setReply(id){ replyTo=id; document.getElementById("t").placeholder="رد على رسالة..."; }
function del(id){ ws.send(JSON.stringify({type:"del",id})); }
function toggleBurn(){ burnMode=!burnMode; document.getElementById("burnBtn").textContent=burnMode?"🔥✔":"🔥"; }
function send(){
  const t=document.getElementById("t").value.trim();
  if(!t) return;
  ws.send(JSON.stringify({type:"msg",text:t,replyTo,burn:burnMode}));
  document.getElementById("t").value=""; replyTo=null; burnMode=false;
  document.getElementById("burnBtn").textContent="🔥";
  document.getElementById("t").placeholder="اكتب رسالة...";
}
function emoji(){
  const list="😀😃😄😁😆😅😂🤣😊😍😘😎🥳😭😢🤭🤍😳😏🍃🪶😡🥀🥰🥱🤢😹😸😺😾😿🙀😽😼😻💘🖤🩷🩶🩵👉🏻👈🏻🫀🔥💔🗿🍭🕊🥹😚🪽";
  const e=prompt("اختر إيموجي:",list);
  if(e){ document.getElementById("t").value += e; document.getElementById("t").focus(); }
}
async function uploadFile(inp){
  const file=inp.files[0]; if(!file) return;
  const fd=new FormData(); fd.append("token",token); fd.append("file",file);
  const r=await fetch("/upload",{method:"POST",body:fd});
  const res=await r.json();
  if(!res.ok) return alert("فشل الرفع");
  const isImg=file.type.startsWith("image/");
  ws.send(JSON.stringify({type:"msg",text:isImg?"":file.name,img:isImg?res.url:null,fname:file.name}));
  inp.value="";
}
async function uploadAvatar(inp){
  const file=inp.files[0]; if(!file) return;
  const fd=new FormData(); fd.append("token",token); fd.append("file",file);
  const r=await fetch("/upload",{method:"POST",body:fd});
  const res=await r.json();
  if(!res.ok) return alert("فشل رفع الصورة");
  const a=await api("/setavatar",{token,url:res.url});
  alert(a.ok?"تم تحديث صورتك ✅":"فشل");
  inp.value="";
}
async function setName(){
  const n=prompt("اسم العرض:", myName);
  if(!n) return;
  const r=await api("/setname",{token,name:n});
  if(r.ok){ myName=n; document.getElementById("me").textContent=n+" (@"+me+")"; alert("تم ✅"); }
}
async function showUsers(){
  const r=await fetch("/users?token="+token);
  const res=await r.json();
  if(res.ok) alert("الأعضاء:\n"+res.users.join("\n"));
}
async function searchMsg(){
  const q=prompt("ابحث بكلمة:"); if(!q) return;
  const r=await fetch("/search?token="+token+"&q="+encodeURIComponent(q));
  const res=await r.json();
  if(!res.ok) return;
  if(!res.results.length) return alert("لا نتائج");
  alert(res.results.map(x=>"@"+x.from+": "+x.text).join("\n\n"));
}

async function toggleVoice(){
  if(!voiceOn){
    try{ localStream = await navigator.mediaDevices.getUserMedia({audio:true}); }
    catch(e){ return alert("ما قدرت أوصل للمايك"); }
    voiceOn=true; document.getElementById("micBtn").classList.add("on");
    ws.send(JSON.stringify({type:"voice_join"}));
  }else{
    voiceOn=false; document.getElementById("micBtn").classList.remove("on");
    ws.send(JSON.stringify({type:"voice_leave"}));
    if(localStream) localStream.getTracks().forEach(t=>t.stop());
    Object.values(peers).forEach(p=>p.close());
    peers={};
  }
}
function makePeer(target){
  const pc=new RTCPeerConnection(rtcConf); peers[target]=pc;
  if(localStream) localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));
  pc.onicecandidate=e=>{ if(e.candidate) ws.send(JSON.stringify({type:"voice_signal",to:target,data:{candidate:e.candidate}})); };
  pc.ontrack=e=>{
    let a=document.getElementById("au_"+target);
    if(!a){ a=document.createElement("audio"); a.id="au_"+target; a.autoplay=true; document.body.appendChild(a); }
    a.srcObject=e.streams[0];
  };
  return pc;
}
async function callPeer(target){
  if(peers[target]||!localStream) return;
  const pc=makePeer(target);
  const offer=await pc.createOffer();
  await pc.setLocalDescription(offer);
  ws.send(JSON.stringify({type:"voice_signal",to:target,data:{sdp:pc.localDescription}}));
}
async function handleVoiceSignal(m){
  if(!voiceOn||!localStream) return;
  if(!peers[m.from]) makePeer(m.from);
  const pc=peers[m.from];
  if(m.data.sdp){
    await pc.setRemoteDescription(new RTCSessionDescription(m.data.sdp));
    if(m.data.sdp.type==="offer"){
      const ans=await pc.createAnswer();
      await pc.setLocalDescription(ans);
      ws.send(JSON.stringify({type:"voice_signal",to:m.from,data:{sdp:pc.localDescription}}));
    }
  }
  if(m.data.candidate){ try{ await pc.addIceCandidate(new RTCIceCandidate(m.data.candidate)); }catch(e){} }
}

function newGroup(){ const n=prompt("اسم المجموعة:"); if(n) ws.send(JSON.stringify({type:"create",name:n,roomType:"group"})); }
function newPrivate(){ const n=prompt("اسم الغرفة:"); if(!n) return; const pw=prompt("كلمة السر:"); if(pw) ws.send(JSON.stringify({type:"create",name:n,roomType:"private",password:pw})); }
function newDm(){ const to=prompt("اسم الشخص (@):"); if(to) ws.send(JSON.stringify({type:"dm",to:to.replace("@","")})); }
function joinRoom(){ const r=prompt("اسم الغرفة:"); if(r) join(r); }
async function report(){
  const target=prompt("الشخص (@):"); if(!target) return;
  const reason=prompt("السبب:")||"";
  const res=await api("/report",{token,target:target.replace("@",""),reason});
  alert(res.ok?"تم إرسال البلاغ ✅":"فشل");
}
async function openAdmin(){
  const r=await fetch("/admin/reports?token="+token);
  const res=await r.json();
  if(!res.ok) return alert("للمالك فقط");
  if(!res.reports.length) return alert("لا بلاغات");
  const lines=res.reports.map(x=>x.reporter+" → @"+x.target+" : "+(x.reason||"-")).join("\n");
  const target=prompt("البلاغات:\n"+lines+"\n\nاكتب @الاسم:");
  if(!target) return;
  const act=prompt("الإجراء: ban / unban / mute / unmute");
  if(!act) return;
  const a=await api("/admin/action",{token,target:target.replace("@",""),action:act});
  alert(a.ok?"تم ✅":"فشل");
}
document.addEventListener("input", function(ev){
  if(ev.target && ev.target.id==="t" && ws && ws.readyState===1){
    ws.send(JSON.stringify({type:"typing"}));
  }
});
if(token) start();
</script>
</body>
 </html>
